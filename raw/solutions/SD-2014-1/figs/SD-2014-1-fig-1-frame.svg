ine x1="369.89" y1="112.15" x2="394.79" y2="112.15" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><polygon points="405.79,112.15 394.79,117.21 394.79,107.09" fill="#1D4ED8"/><text x="414.79" y="112.15" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">u<tspan dy="5.40" font-size="12.24">2</tspan></text><line x1="255.43" y1="357.90" x2="295.05" y2="357.90" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="307.05,357.90 295.05,363.42 295.05,352.38" fill="#C0392B"/><text x="337.98" y="357.90" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ü<tspan dy="5.10" font-size="11.56">g</tspan><tspan dy="-5.10" font-size="17">(t)</tspan></text><rect x="710" y="74" width="278" height="152" rx="12" fill="#EEF4FF" stroke="#C7D9F5" stroke-width="1.3"/><text x="726.00" y="100.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">分母是「全結構總質量」</text><text x="726.00" y="126.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">m = 1500 kg（每層相同）</text><text x="726.00" y="148.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">M<tspan dy="3.75" font-size="8.5">total</tspan><tspan dy="-3.75" font-size="12.5"> = 2m = 3000 kg</tspan></text><text x="726.00" y="170.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">ρ<tspan dy="3.75" font-size="8.5">i</tspan><tspan dy="-3.75" font-size="12.5"> = m</tspan><tspan dy="3.75" font-size="8.5">i</tspan><tspan dy="-3.75" font-size="12.5">* / M</tspan><tspan dy="3.75" font-size="8.5">total</tspan></text><text x="726.00" y="192.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">不是 m<tspan dy="3.75" font-size="8.5">i</tspan><tspan dy="-3.75" font-size="12.5">* / M</tspan><tspan dy="3.75" font-size="8.5">i</tspan><tspan dy="-3.75" font-size="12.5"> —— 後者會</tspan></text><text x="726.00" y="214.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">讓 Σρ 湊不到 100%。</text><rect x="710" y="244" width="278" height="148" rx="12" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="726.00" y="270.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">兩個不同的「模態質量」</text><text x="724.00" y="296.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">M<tspan dy="3.60" font-size="8.16">i</tspan><tspan dy="-3.60" font-size="12"> = {φ}</tspan><tspan dy="-4.80" font-size="8.16">T</tspan><tspan dy="4.80" font-size="12">[m]{φ}    廣義質量</tspan></text><text x="724.00" y="317.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">m<tspan dy="3.60" font-size="8.16">i</tspan><tspan dy="-3.60" font-size="12">* = L</tspan><tspan dy="3.60" font-size="8.16">i</tspan><tspan dy="-8.40" font-size="8.16">2</tspan><tspan dy="4.80" font-size="12">/M</tspan><tspan dy="3.60" font-size="8.16">i</tspan><tspan dy="-3.60" font-size="12">     有效質量</tspan></text><text x="724.00" y="338.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">L<tspan dy="3.60" font-size="8.16">i</tspan><tspan dy="-3.60" font-size="12"> = {φ}</tspan><tspan dy="-4.80" font-size="8.16">T</tspan><tspan dy="4.80" font-size="12">[m]{1}     激振係數</tspan></text><text x="724.00" y="359.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">三者單位都是 kg，混用是</text><text x="724.00" y="380.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">本題最常見的失分方式。</text><text x="215.51" y="422.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">T<tspan dy="4.05" font-size="9.18">1</tspan><tspan dy="-4.05" font-size="13.5"> = 0.20 s、T</tspan><tspan dy="4.05" font-size="9.18">2</tspan><tspan dy="-4.05" font-size="13.5"> = 0.075 s，各模態阻尼比 ξ = 0.05；兩層質量相同、以水平地表加速度為輸入。</tspan></text></svg>