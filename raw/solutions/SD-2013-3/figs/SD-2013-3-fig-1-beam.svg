" y1="232.71" x2="139.86" y2="310.59" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="372.00" y1="232.71" x2="372.00" y2="310.59" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="139.86" y1="298.71" x2="372.00" y2="298.71" stroke="#8A94A6" stroke-width="1.2"/><polygon points="139.86,298.71 147.86,301.91 147.86,295.51" fill="#8A94A6"/><polygon points="372.00,298.71 364.00,295.51 364.00,301.91" fill="#8A94A6"/><text x="255.93" y="314.71" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L/2</text><line x1="372.00" y1="232.71" x2="372.00" y2="310.59" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="604.14" y1="232.71" x2="604.14" y2="310.59" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="372.00" y1="298.71" x2="604.14" y2="298.71" stroke="#8A94A6" stroke-width="1.2"/><polygon points="372.00,298.71 380.00,301.91 380.00,295.51" fill="#8A94A6"/><polygon points="604.14,298.71 596.14,295.51 596.14,301.91" fill="#8A94A6"/><text x="488.07" y="314.71" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L/2</text><circle cx="139.86" cy="232.71" r="5.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="604.14" cy="232.71" r="5.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="139.86" y="158.71" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">固定端</text><text x="139.86" y="178.71" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">φ(0) = φ'(0) = 0</text><text x="604.14" y="158.71" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">自由端</text><text x="604.14" y="178.71" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">M = V = 0</text><rect x="766" y="78" width="218" height="190" rx="12" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="782.00" y="104.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">動能分母有兩項</text><text x="780.00" y="132.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">分佈質量：∫m φ<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5"> dx</tspan></text><text x="780.00" y="154.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">集中質量：(W/g)[φ(L/2)]<tspan dy="-5.00" font-size="8.5">2</tspan></text><text x="780.00" y="176.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">漏掉第二項是本題最常見</text><text x="780.00" y="198.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">的失分點；把 W 直接當質量</text><text x="780.00" y="220.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">用（忘了除以 g）是第二常見。</text><text x="780.00" y="242.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">φ(L/2) = 17/16 決定第二項的</text><text x="780.00" y="264.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">權重，位置錯 → 權重全錯。</text><text x="214.16" y="354.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">集中重量在 L/2 而不是自由端——這決定了它在 Rayleigh 商裡的權重只有 φ(L/2)<tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5">，不是 φ(L)</tspan><tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5">。</tspan></text></svg>