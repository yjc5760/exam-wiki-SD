63.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">φ'(0) = 0               幾何 ✓</text><text x="786.00" y="184.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">φ''(L) = 12(L−L)<tspan dy="-4.60" font-size="7.82">2</tspan><tspan dy="4.60" font-size="11.5"> = 0   力學 ✓</tspan></text><text x="786.00" y="205.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">φ'''(L) = −24(L−L) = 0     力學 ✓</text><text x="786.00" y="226.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">幾何 BC 是必要條件，</text><text x="786.00" y="247.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">力學 BC 滿足則精度更高。</text><rect x="772" y="280" width="226" height="148" rx="12" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="788.00" y="306.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">兩條線幾乎重合的後果</text><text x="786.00" y="332.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">分佈質量主導時，Rayleigh</text><text x="786.00" y="353.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">誤差僅 0.8%（見 fig-3）；</text><text x="786.00" y="374.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">但集中質量主導時，真實</text><text x="786.00" y="395.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">振態會偏離 UDL 曲線，</text><text x="786.00" y="416.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">誤差擴大到 6.3%。</text><text x="505.00" y="548.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">形函數不必是真的振態，但必須滿足幾何邊界條件——兩條線的貼合程度，直接就是 Rayleigh 誤差的大小。</text></svg>