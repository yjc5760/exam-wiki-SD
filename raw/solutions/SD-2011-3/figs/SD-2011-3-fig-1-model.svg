roke-width="3.0" stroke-linecap="round"/><polygon points="250.00,344.50 245.40,334.50 254.60,334.50" fill="#C0392B"/><text x="260.00" y="319.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">mg</text><text x="250.00" y="354.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">t = 0：靜平衡</text><text x="250.00" y="382.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">k·δst = mg</text><line x1="450.00" y1="119.50" x2="662.50" y2="119.50" stroke="#C3CAD5" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="450.00" y1="63.25" x2="662.50" y2="63.25" stroke="#6B7684" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><line x1="466.25" y1="63.25" x2="448.75" y2="45.75" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="501.25" y1="63.25" x2="483.75" y2="45.75" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="536.25" y1="63.25" x2="518.75" y2="45.75" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="571.25" y1="63.25" x2="553.75" y2="45.75" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="606.25" y1="63.25" x2="588.75" y2="45.75" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="641.25" y1="63.25" x2="623.75" y2="45.75" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="478.75" y1="119.50" x2="478.75" y2="73.25" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round"/><polygon points="478.75,63.25 483.35,73.25 474.15,73.25" fill="#C0392B"/><text x="468.75" y="90.75" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">v t</text><polyline points="556.25,63.25 556.25,70.31 568.75,77.38 543.75,91.50 568.75,105.62 543.75,119.75 568.75,133.88 543.75,148.00 568.75,162.12 543.75,176.25 568.75,190.38 556.25,197.44 556.25,204.50" fill="none" stroke="#1D4ED8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="450.00" y1="250.75" x2="662.50" y2="250.75" stroke="#C3CAD5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><rect x="522.25" y="200.5" width="68" height="46" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3.0"/><text x="556.25" y="223.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">m</text><line x1="633.75" y1="250.75" x2="633.75" y2="214.50" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round"/><polygon points="633.75,204.50 638.35,214.50 629.15,214.50" fill="#1D4ED8"/><text x="643.75" y="227.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">u</text><text x="556.25" y="354.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">t > 0：上端上升 v t、電梯上升 u</text><text x="556.25" y="382.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">彈簧變形 Δ = δst + (v t − u)</text><text x="440.00" y="424.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">m ü = k[δst + (v t − u)] − mg　→　靜態項 k·δst − mg = 0 自動對消</text><text x="440.00" y="452.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">→　m ü + k u = k v t（Ramp 型激振）</text><text x="440.00" y="480.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">座標 u 自靜平衡位置量起，故 mg 不可再出現在方程式右端；彈簧變形也不是 u，而是「上端位移 − 下端位移」</text></svg>