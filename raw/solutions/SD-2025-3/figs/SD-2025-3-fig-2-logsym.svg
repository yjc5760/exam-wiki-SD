" r="5.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2.0"/><line x1="363.59" y1="354.26" x2="476.20" y2="354.26" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><circle cx="363.59" cy="354.26" r="5.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="2.0"/><circle cx="476.20" cy="354.26" r="5.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="2.0"/><text x="344.06" y="292.70" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ζ<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5"> = ζ</tspan><tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5"> = 5%</tspan></text><text x="217.02" y="326.70" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ω<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5"> = 14.5</tspan></text><text x="572.35" y="326.70" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ω<tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5"> = 46.2</tspan></text><text x="277.25" y="380.26" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ω*<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">/ω</tspan><tspan dy="3.75" font-size="8.5">2</tspan><tspan dy="-3.75" font-size="12.5"> = 21.5</tspan></text><text x="488.20" y="380.26" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">ω<tspan dy="3.75" font-size="8.5">2</tspan><tspan dy="-3.75" font-size="12.5"> = 31.1，與左邊同一個 ζ = 4.34%</tspan></text><circle cx="419.90" cy="359.64" r="6.0" fill="#B45309" stroke="#FFFFFF" stroke-width="2.0"/><text x="348.73" y="411.64" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">最低 ζ = √(a<tspan dy="3.75" font-size="8.5">0</tspan><tspan dy="-3.75" font-size="12.5">a</tspan><tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5">) = 0.0426</tspan></text><circle cx="468.72" cy="355.60" r="5.2" fill="#2E7D6F" stroke="#FFFFFF" stroke-width="1.8"/><line x1="468.72" y1="355.60" x2="468.72" y2="425.34" stroke="#2E7D6F" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><text x="348.05" y="437.64" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">算術平均 (ω<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5">+ω</tspan><tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5">)/2 = 30.35，不在對稱軸上</tspan></text><rect x="768" y="96" width="238" height="156" rx="12" fill="#EEF4FF" stroke="#C7D9F5" stroke-width="1.3"/><text x="784.00" y="122.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">為什麼是幾何平均</text><text x="784.00" y="148.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">把 ω 換成 ω*<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">/ω 代進</tspan></text><text x="784.00" y="170.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">ζ(ω) = a<tspan dy="3.75" font-size="8.5">0</tspan><tspan dy="-3.75" font-size="12.5">/(2ω) + a</tspan><tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5">ω/2，</tspan></text><text x="784.00" y="192.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">兩項恰好互換 → ζ 不變。</text><text x="784.00" y="214.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">故 ζ(ω) = ζ(ω*<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">/ω)，</tspan></text><text x="784.00" y="236.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">對數軸上對稱於 ω*。</text><rect x="768" y="270" width="238" height="130" rx="12" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="784.00" y="296.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">兩個平均差多少</text><text x="784.00" y="322.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">幾何 √(ω<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5">ω</tspan><tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5">) = 25.88</tspan></text><text x="784.00" y="346.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">算術 (ω<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5">+ω</tspan><tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5">)/2 = 30.35</tspan></text><text x="784.00" y="370.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">ζ 差 0.00054（1.3%）</text><text x="220.19" y="532.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">ω<tspan dy="4.05" font-size="9.18">2</tspan><tspan dy="-4.05" font-size="13.5"> 與 21.5 的 ζ 完全相同——等 ζ 的兩個頻率互為 ω* 的鏡像，這正是 ω* 只能是幾何平均的證據。</tspan></text></svg>