<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="552" viewBox="0 0 1280 552"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="640" height="430"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="640" height="430"/></clipPath></defs><rect width="1280" height="552" fill="#FFFFFF"/><text x="640.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 2　扭轉不規則性：Δmax ＞ 1.2 Δavg 的來源是 CM 與 CR 的偏心</text><text x="640.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">平面 20 m × 12 m｜CR = 7.50 m、CM = 10.00 m、e = 2.50 m｜扭轉勁度 J = Σk(x−x_CR)² = 275k｜偶然偏心 ±0.05B = ±1.0 m｜Ax = 1.23（不必大於 3.0）</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="628" height="418" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="320.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">平面配置</text><text x="320.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">Y 向構架 2k : 1k : 1k，剛心被拉向左側</text><polyline points="70.00,338.00 328.95,338.00 328.95,182.63 70.00,182.63 70.00,338.00" fill="none" stroke="#3F4A5A" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="70.00" y1="338.00" x2="70.00" y2="182.63" stroke="#3F4A5A" stroke-width="5.2" stroke-linecap="butt" opacity="1.0"/><text x="70.00" y="202.63" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#3