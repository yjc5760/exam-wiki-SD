s-serif" font-size="11.8" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">1.2 Δavg = 0.327</text><circle cx="502.00" cy="148.77" r="6.6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><text x="320.00" y="400.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">Δmax / Δavg = 1.333 ＞ 1.2 → 判定為扭轉不規則</text></g><text x="640.0" y="530" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">攔錯：只寫「靜力法不準」。真正的原因是平移與扭轉振態耦合且頻率接近，±5% 偶然偏心與 Ax 都只是靜態補償，取代不了 CQC 對相位差的處理</text></svg>