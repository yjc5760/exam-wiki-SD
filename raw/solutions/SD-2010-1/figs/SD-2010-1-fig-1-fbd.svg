','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text><line x1="250.00" y1="432.00" x2="206.90" y2="412.75" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="363.97" y1="176.79" x2="320.87" y2="157.55" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="213.48" y1="415.69" x2="327.45" y2="160.48" stroke="#8A94A6" stroke-width="1.2"/><polygon points="213.48,415.69 219.66,409.69 213.82,407.08" fill="#8A94A6"/><polygon points="327.45,160.48 321.26,166.48 327.11,169.09" fill="#8A94A6"/><text x="257.68" y="282.38" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L</text><text x="264.00" y="191.63" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">θ</text><line x1="363.97" y1="176.79" x2="257.72" y2="176.79" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="245.72,176.79 257.72,171.27 257.72,182.31" fill="#C0392B"/><text x="151.22" y="160.79" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">F<tspan dy="4.50" font-size="10.2">s</tspan><tspan dy="-4.50" font-size="15"> = k L sinθ</tspan></text><line x1="230.67" y1="176.79" x2="230.67" y2="432.00" stroke="#C0392B" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="250.00" y1="432.00" x2="230.67" y2="432.00" stroke="#C0392B" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="230.67" y1="432.00" x2="169.31" y2="432.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="230.67" y1="176.79" x2="169.31" y2="176.79" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="178.67" y1="432.00" x2="178.67" y2="176.79" stroke="#8A94A6" stroke-width="1.2"/><polygon points="178.67,432.00 181.87,424.00 175.47,424.00" fill="#8A94A6"/><polygon points="178.67,176.79 175.47,184.79 181.87,184.79" fill="#8A94A6"/><text x="164.67" y="304.40" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L cosθ</text><text x="164.67" y="324.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">彈簧力的力臂</text><line x1="363.97" y1="176.79" x2="363.97" y2="283.04" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="363.97,295.04 358.45,283.04 369.49,283.04" fill="#C0392B"/><text x="375.97" y="295.04" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">W = mg</text><line x1="363.97" y1="166.04" x2="363.97" y2="118.10" stroke="#C0392B" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="250.00" y1="148.20" x2="250.00" y2="118.10" stroke="#C3CAD5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="250.00" y1="126.70" x2="250.00" y2="93.66" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="363.97" y1="126.70" x2="363.97" y2="93.66" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="250.00" y1="98.70" x2="363.97" y2="98.70" stroke="#8A94A6" stroke-width="1.2"/><polygon points="250.00,98.70 258.00,101.90 258.00,95.50" fill="#8A94A6"/><polygon points="363.97,98.70 355.97,95.50 355.97,101.90" fill="#8A94A6"/><text x="306.98" y="84.70" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L sinθ</text><text x="306.98" y="60.70" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">重力的力臂</text><text x="700.00" y="190.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">對 B 取力矩（小角度）</text><text x="618.23" y="224.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">恢復：F<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> · L cosθ  →  k L² θ</tspan></text><text x="700.00" y="256.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">傾覆：W · L sinθ    →  m g L θ</text><text x="700.00" y="288.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">m L² θ'' + (k L² − m g L) θ = 0</text><text x="700.00" y="320.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">穩定 ⇔ k L² > m g L ⇔ k > mg/L</text><text x="440.00" y="492.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩個力臂不可互換：彈簧是水平力 → 力臂取鉛垂高度；重力是鉛垂力 → 力臂取水平偏距</text></svg>