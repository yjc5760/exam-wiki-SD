minant-baseline="middle" font-weight="400">k<tspan dy="3.45" font-size="7.82">e</tspan><tspan dy="-3.45" font-size="11.5">ff/(mgL) = +0.00</tspan></text><line x1="748.00" y1="212.00" x2="784.00" y2="212.00" stroke="#C0392B" stroke-width="4.2" stroke-linecap="round" opacity="1.0"/><text x="794.00" y="212.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">r = kL/(mg) = 0.55</text><text x="794.00" y="229.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">不穩定：θ=0 為峰</text><text x="794.00" y="245.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">k<tspan dy="3.45" font-size="7.82">e</tspan><tspan dy="-3.45" font-size="11.5">ff/(mgL) = -0.45</tspan></text><text x="510.00" y="476.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">θ = 0 恆為平衡點，但只有 ∂²V/∂θ² = kL² − mgL > 0（即 r > 1）時才是「谷」——這就是穩定條件</text><text x="510.00" y="498.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">r = 1 時曲線在原點變平，ω → 0，即分岔（bifurcation）臨界狀態；r 小於 1 時 ω² 為負，無實數頻率</text></svg>