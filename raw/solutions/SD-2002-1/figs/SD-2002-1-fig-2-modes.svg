nd" stroke-dasharray="5 4" opacity="1.0"/><text x="237.00" y="86.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">剛體隨動位置 Lθ<tspan dy="3.75" font-size="8.5">1</tspan></text><text x="300.00" y="424.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">u2/(L·θ1) = -1.20　（柱變形 Δ = u2 - L·θ1 = -6.61 m/rad）</text><text x="300.00" y="446.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">→ 基座搖擺主導：樓版與剛體隨動反向</text></g><text x="600.0" y="570" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">兩格用同一個 θ1；u2 的長度比 = 特徵向量比，故「哪個模態柱變形大」是看出來的，不是說出來的</text></svg>