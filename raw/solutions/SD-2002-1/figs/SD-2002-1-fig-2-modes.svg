<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="592" viewBox="0 0 1200 592"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="600" height="470"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="600" height="470"/></clipPath></defs><rect width="1200" height="592" fill="#FFFFFF"/><text x="600.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">兩個振態：以「剛體隨動量 L·θ1 = 3 m/rad」為判準</text><text x="600.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">Rayleigh 商界限 √(K22/M22) = 24.5 與 √(K11/M11) = 32.3 恰落在 ω1 = 23.4 與 ω2 = 33.2 之間</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="600" height="470" fill="#F5F7FA"/><rect x="6" y="6" width="588" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="300.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">Mode 1：ω = 23.4 rad/s，T = 0.269 s</text><text x="300.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">θ1 = 1 rad 時 u2 = +33.27 m</text><line x1="2.50" y1="320.00" x2="577.50" y2="320.00" stroke="#6B7684" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="7 5" opacity="1.0"/><polygon points="96.25,320.00 333.75,320.00 333.75,357.50 96.25,357.50" fill="rgba(0,0,0,0.05)" stroke="#C3CAD5" stroke-width="1.5" opacity="1.0"/><line x1="140.00" y1="320.00" x2="140.00" y2="120.00" stroke="#C3CAD5" stroke-width="1.8599999999999999" stroke-linecap="butt" stroke-dasharray="6 5" opacit