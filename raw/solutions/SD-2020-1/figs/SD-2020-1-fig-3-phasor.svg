<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="470" viewBox="0 0 1010 470"><rect width="1010" height="470" fill="#FFFFFF"/><text x="290.73" y="40.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">傳遞力 F<tspan dy="5.25" font-size="11.9">trans</tspan><tspan dy="-5.25" font-size="17.5"> 的相量合成（示範點 r = 2.30、ξ = 0.20）</tspan></text><line x1="214" y1="298" x2="390.0" y2="298" stroke="#6B7684" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="214.0" y1="298.0" x2="345.2" y2="298.0" stroke="#1D4ED8" stroke-width="4.2" stroke-linecap="round"/><polygon points="358.2,298.0 345.2,304.0 345.2,292.0" fill="#1D4ED8"/><line x1="358.2" y1="298.0" x2="358.2" y2="178.3" stroke="#2E7D6F" stroke-width="4.2" stroke-linecap="round"/><polygon points="358.2,165.3 364.2,178.3 352.3,178.3" fill="#2E7D6F"/><line x1="214.0" y1="298.0" x2="348.7" y2="174.1" stroke="#C0392B" stroke-width="5.0" stroke-linecap="round"/><polygon points="358.2,165.3 352.7,178.5 344.6,169.7" fill="#C0392B"/><polyline points="341.2424783053186,298 341.2424783053186,281 358.2424783053186,281" fill="none" stroke="#6B7684" stroke-width="1.7"/><text x="286.12" y="325.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">k U</text><text x="372.24" y="231.65" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">c Ω U</text><text x="239.57" y="227.92" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">F<tspan dy="5.40" font-size="12.24">trans</tspan></text><text x="210.00" y="362.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">彈簧力與阻尼力相位差 90°，取向量和：</text><text x="210.00" y="388.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">c Ω U / (k U) = 2ξr = 0.920</text><text x="210.00" y="414.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">F<tspan dy="4.20" font-size="9.52">trans</tspan><tspan dy="-4.20" font-size="14"> = k U √(1 + (2ξr)</tspan><tspan dy="-5.60" font-size="9.52">2</tspan><tspan dy="5.60" font-size="14">) = 1.6383 · k X</tspan><tspan dy="4.20" font-size="9.52">g</tspan></text><rect x="494" y="74" width="482" height="186" rx="12" fill="#EEF4FF" stroke="#C7D9F5" stroke-width="1.3"/><text x="512.00" y="100.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">正確的三步</text><text x="510.00" y="130.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">① F<tspan dy="3.75" font-size="8.5">trans</tspan><tspan dy="-3.75" font-size="12.5"> = k U √(1 + (2ξr)</tspan><tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">)</tspan></text><text x="510.00" y="156.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">② U = r<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">X</tspan><tspan dy="3.75" font-size="8.5">g</tspan><tspan dy="-3.75" font-size="12.5"> / √((1−r</tspan><tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">)</tspan><tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5"> + (2ξr)</tspan><tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">)</tspan></text><text x="510.00" y="182.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">③ |x''<tspan dy="3.75" font-size="8.5">abs</tspan><tspan dy="-3.75" font-size="12.5">| = F</tspan><tspan dy="3.75" font-size="8.5">trans</tspan><tspan dy="-3.75" font-size="12.5">/m，而 k/m = ω</tspan><tspan dy="3.75" font-size="8.5">0</tspan><tspan dy="-8.75" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">、ω</tspan><tspan dy="3.75" font-size="8.5">0</tspan><tspan dy="-8.75" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">r</tspan><tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5"> = Ω</tspan><tspan dy="-5.00" font-size="8.5">2</tspan></text><text x="510.00" y="208.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">   → |x''<tspan dy="3.75" font-size="8.5">abs</tspan><tspan dy="-3.75" font-size="12.5">| = Ω</tspan><tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">X</tspan><tspan dy="3.75" font-size="8.5">g</tspan><tspan dy="-3.75" font-size="12.5"> · TR</tspan></text><text x="510.00" y="234.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">本例：F<tspan dy="3.75" font-size="8.5">trans</tspan><tspan dy="-3.75" font-size="12.5">/(kX</tspan><tspan dy="3.75" font-size="8.5">g</tspan><tspan dy="-3.75" font-size="12.5">) = 1.6383，TR = 0.3097</tspan></text><rect x="494" y="278" width="482" height="134" rx="12" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="512.00" y="304.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">兩個必查的檢核點</text><text x="510.00" y="330.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">F<tspan dy="3.60" font-size="8.16">trans</tspan><tspan dy="-3.60" font-size="12"> 分子必須含 r</tspan><tspan dy="-4.80" font-size="8.16">2</tspan><tspan dy="4.80" font-size="12">（來自 U）。漏掉會得到</tspan></text><text x="510.00" y="351.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">TR/r<tspan dy="-4.80" font-size="8.16">2</tspan><tspan dy="4.80" font-size="12">，在 r → 0 時發散，明顯不合物理。</tspan></text><text x="510.00" y="372.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">絕對加速度振幅是 Ω<tspan dy="-4.80" font-size="8.16">2</tspan><tspan dy="4.80" font-size="12">X</tspan><tspan dy="3.60" font-size="8.16">abs</tspan><tspan dy="-3.60" font-size="12">，不是 ω</tspan><tspan dy="3.60" font-size="8.16">0</tspan><tspan dy="-8.40" font-size="8.16">2</tspan><tspan dy="4.80" font-size="12">X</tspan><tspan dy="3.60" font-size="8.16">abs</tspan><tspan dy="-3.60" font-size="12">——</tspan></text><text x="510.00" y="393.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">反應以激振頻率 Ω 振盪，微分兩次帶出的是 Ω<tspan dy="-4.80" font-size="8.16">2</tspan><tspan dy="4.80" font-size="12">。</tspan></text><text x="196.48" y="446.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">相量圖只負責「合成」這一步；r<tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5"> 是從 U 帶進來的——把這兩件事分開看，就不會把 r</tspan><tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5"> 弄丟或多塞一個。</tspan></text></svg>