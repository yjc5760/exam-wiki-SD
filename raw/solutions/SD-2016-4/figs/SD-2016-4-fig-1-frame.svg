ext-anchor="start" dominant-baseline="middle" font-weight="400">頂層上方沒有樓層 → 只有 k。</text><text x="728.00" y="421.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">這一格寫錯，特徵值全錯。</text><text x="352.62" y="490.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">k = 1.15×10<tspan dy="-5.40" font-size="9.18">6</tspan><tspan dy="5.40" font-size="13.5"> N/m，m = 5×10</tspan><tspan dy="-5.40" font-size="9.18">3</tspan><tspan dy="5.40" font-size="13.5"> kg，k/m = 230 rad</tspan><tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5">/s</tspan><tspan dy="-5.40" font-size="9.18">2</tspan></text></svg>