.52">2</tspan><tspan dy="5.60" font-size="14">/T) c δ</tspan><tspan dy="4.20" font-size="9.52">r</tspan><tspan dy="-9.80" font-size="9.52">2</tspan></text><text x="626.00" y="230.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">W<tspan dy="4.20" font-size="9.52">k</tspan><tspan dy="-4.20" font-size="14"> = k δ</tspan><tspan dy="-5.60" font-size="9.52">2</tspan><tspan dy="5.60" font-size="14">/2</tspan></text><text x="626.00" y="262.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">Δβ = W<tspan dy="4.20" font-size="9.52">V</tspan><tspan dy="-4.20" font-size="14">/(4πW</tspan><tspan dy="4.20" font-size="9.52">k</tspan><tspan dy="-4.20" font-size="14">) = 11.86%</tspan></text><text x="626.00" y="290.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">β<tspan dy="4.20" font-size="9.52">eff</tspan><tspan dy="-4.20" font-size="14"> = 5% + 11.86% = 16.86%</tspan></text><text x="136.24" y="494.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">若 W<tspan dy="3.90" font-size="8.84">k</tspan><tspan dy="-3.90" font-size="13"> 漏掉 ½（寫成 kδ²），Δβ 會變成 5.93%，恰好少一半。δ² 在分子分母同時出現，故 Δβ 與振幅無關</tspan></text></svg>