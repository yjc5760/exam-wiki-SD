<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="582" viewBox="0 0 1000 582" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="500" height="460"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="500" height="460"/></clipPath></defs><rect width="1000" height="582" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">隔震層與上部結構是串聯：最軟的彈簧主宰全局</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">k_b/k_sup = 0.109，隔震層軟了快 10 倍，所以整體週期由它決定</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="500" height="460" fill="#FFFFFF"/><rect x="6" y="6" width="488" height="448" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="250.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">力學模型：兩根彈簧串聯</text><text x="250.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">同一個力走過兩根彈簧，位移相加</text><rect x="150" y="96" width="200" height="112" rx="10" fill="#EDF1F6" stroke="#E1E6ED" stroke-width="1.4"/><text x="250.00" y="140.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">上部結構</text><text x="220.45" y="166.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">k<tspan dy="4.20" font-size="9.52">sup</tspan><tspan dy="-4.20" font-size="14"> = 755</tspan></text><text x="250.00" y="188.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">tf/cm</text><polyline points="250.00,208.00 276.00,218.22 224.00,228.44 276.00,238.67 224.00,248.89 276.00,259.11 224.00,269.33 276.00,279.56 224.00,289.78 250.00,300.00" fill="none" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="320.00" y="244.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">隔震層</text><text x="320.00" y="268.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">k<tspan dy="4.05" font-size="9.18">b</tspan><tspan dy="-4.05" font-size="13.5"> = 82.6</tspan></text><rect x="120" y="300" width="260" height="18" rx="4" fill="#C3CAD5" stroke="none" stroke-width="1"/><line x1="-0.60" y1="318.00" x2="0.40" y2="318.00" stroke="#3F4A5A" stroke-width="1.4" stroke-linecap="round"/><line x1="62.05" y1="318.00" x2="63.05" y2="318.00" stroke="#3F4A5A" stroke-width="1.4" stroke-linecap="round"/><line x1="124.70" y1="318.00" x2="125.70" y2="318.00" stroke="#3F4A5A" stroke-width="1.4" stroke-linecap="round"/><line x1="187.35" y1="318.00" x2="188.35" y2="318.00" stroke="#3F4A5A" stroke-width="1.4" stroke-linecap="round"/><line x1="250.00" y1="318.00" x2="251.00" y2="318.00" stroke="#3F4A5A" stroke-width="1.4" stroke-linecap="round"/><line x1="312.65" 