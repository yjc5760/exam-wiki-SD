ang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">D (cm)</text><text x="72.00" y="83.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">F (tf)</text><polygon points="393.27,117.51 144.73,215.12 144.73,298.49 393.27,200.88" fill="rgba(180,83,9,0.18)" stroke="#B45309" stroke-width="2.4" opacity="1.0"/><text x="255.00" y="394.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">Wd = 4μW·D = 44,507 tf·cm</text><text x="255.00" y="420.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">ξeq = 2μ/(πA) = 29.3%</text></g><text x="510.0" y="550" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">分母一律用「系統」的割線勁度：ξ = Wd/(2π·Keff·D²)。用單顆支承的勁度、或用 kd 當分母，都會算錯阻尼比。</text></svg>