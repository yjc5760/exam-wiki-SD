" dominant-baseline="middle" font-weight="400">兩件事由同一片滑動面同時做完</text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect width="520" height="470" fill="#FFFFFF"/><rect x="6" y="6" width="508" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">週期與重量完全無關</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">這是 FPS 最反直覺、也最常被考的性質</text><rect x="70" y="124" width="150" height="52" rx="8" fill="#EDF1F6" stroke="#E1E6ED" stroke-width="1.2"/><text x="80.00" y="150.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">W = 6,000 tf</text><line x1="250.00" y1="150.00" x2="337.00" y2="150.00" stroke="#8A94A6" stroke-width="2.2" stroke-linecap="round"/><polygon points="346.00,150.00 337.00,154.14 337.00,145.86" fill="#8A94A6"/><text x="430.00" y="150.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">T = 2.975 s</text><rect x="70" y="209" width="176" height="52" rx="8" fill="#EDF1F6" stroke="#E1E6ED" stroke-width="1.2"/><text x="80.00" y="235.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">W = 12,000 tf</text><line x1="276.00" y1="235.00" x2="337.00" y2="235.00" stroke="#8A94A6" stroke-width="2.2" stroke-linecap="round"/><polygon points="346.00,235.00 337.00,239.14 337.00,230.86" fill="#8A94A6"/><text x="430.00" y="235.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">T = 2.975 s</text><rect x="70" y="294" width="202" height="52" rx="8" fill="#EDF1F6" stroke="#E1E6ED" stroke-width="1.2"/><text x="80.00" y="320.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">W = 24,000 tf</text><line x1="302.00" y1="320.00" x2="337.00" y2="320.00" stroke="#8A94A6" stroke-width="2.2" stroke-linecap="round"/><polygon points="346.00,320.00 337.00,324.14 337.00,315.86" fill="#8A94A6"/><text x="430.00" y="320.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">T = 2.975 s</text><rect x="56" y="356" width="408" height="92" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="70.00" y="374.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.0" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">為什麼可以約掉</text><text x="70.00" y="398.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">T = 2π√(m/k)，而 k = W/R = mg/R</text><text x="70.00" y="419.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">⇒ T = 2π√(mR/mg) = 2π√(R/g)，m 被約掉了</text><text x="70.00" y="440.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">R = 220 cm ⇒ T = 2.975 s</text></g><text x="520.0" y="570" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">注意：純單擺週期 2.98 s 與 W 無關，但加了摩擦項之後的「有效週期」2.19 s 會隨位移 D 改變——這兩個週期不是同一個東西。</text></svg>