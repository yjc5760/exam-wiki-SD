<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="592" viewBox="0 0 1040 592" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="520" height="470"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="520" height="470"/></clipPath></defs><rect width="1040" height="592" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">FPS：回復力來自幾何（W·D/R），阻尼來自摩擦（μW）</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">本案例 R = 220 cm、μ = 0.06，定案位移 D = 15.5 cm 時回復力 843 tf ＋ 摩擦力 720 tf = 1,563 tf</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="520" height="470" fill="#FFFFFF"/><rect x="6" y="6" width="508" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">倒單擺幾何</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">滑動面是半徑 R 的球面</text><polyline points="81.91,203.28 83.81,206.27 85.77,209.23 87.77,212.15 89.82,215.04 91.92,217.89 94.07,220.71 96.26,223.49 98.50,226.24 100.79,228.94 103.12,231.61 105.50,234.23 107.92,236.82 110.39,239.37 112.90,241.87 115.45,244.33 118.04,246.75 120.67,249.12 123.34,251.45 126.05,253.73 128.79,255.97 131.58,258.16 134.40,260.30 137.26,262.39 140.15,264.44 143.08,266.44 146.04,268.39 149.03,270.28 152.05,2